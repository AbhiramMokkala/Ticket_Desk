server {
    listen 80;
    server_name localhost;

    # Maximum upload size for attachments (10MB)
    client_max_body_size 10M;

    # Frontend Single Page App routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Gateway Health Check
    location /health {
        access_log off;
        return 200 '{"status":"UP","gateway":"nginx-frontend"}';
        add_header Content-Type application/json;
    }

    # Java Service Endpoints
    location /api/auth {
        proxy_pass http://java-ticket-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/dashboard {
        proxy_pass http://java-ticket-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users {
        proxy_pass http://java-ticket-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # .NET Comment Service: /api/tickets/{id}/comments
    location ~ ^/api/tickets/[^/]+/comments {
        proxy_pass http://dotnet-comment-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python Attachment Service: /api/tickets/{id}/attachments
    location ~ ^/api/tickets/[^/]+/attachments {
        proxy_pass http://python-attachment-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python Attachment Service: /api/attachments
    location /api/attachments {
        proxy_pass http://python-attachment-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Java Core Tickets Endpoint
    location /api/tickets {
        proxy_pass http://java-ticket-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
