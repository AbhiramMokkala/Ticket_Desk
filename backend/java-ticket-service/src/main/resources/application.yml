spring:
  application:
    name: java-ticket-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:TicketDeskJwtSecretKeyForVirtusaPOC2026SecureStringMustBe256BitsLong!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    issuer: ${JWT_ISSUER:ticketdesk-auth-service}
    audience: ${JWT_AUDIENCE:ticketdesk-platform}
  internal:
    secret-key: ${INTERNAL_SERVICE_KEY:TicketDeskInternalServiceAuthSecret2026!}
  seed-demo-data: ${DEMO_DATA_SEED:true}
