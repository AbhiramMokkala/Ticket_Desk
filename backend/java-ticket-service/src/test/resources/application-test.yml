spring:
  datasource:
    url: jdbc:h2:mem:ticketdesk_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: TestTicketDeskJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256Testing!
    expiration-hours: 2
    issuer: ticketdesk-auth-service
    audience: ticketdesk-platform
  internal:
    secret-key: TestInternalKey123!
  seed-demo-data: false
