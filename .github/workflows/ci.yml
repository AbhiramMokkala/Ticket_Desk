name: TicketDesk CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-java-service:
    name: Java Spring Boot Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run JUnit Tests
        working-directory: ticketdesk/backend/java-ticket-service
        run: mvn clean test

  test-dotnet-service:
    name: .NET 8 Comment Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        working-directory: ticketdesk/backend/dotnet-comment-service
        run: dotnet restore

      - name: Run xUnit Tests
        working-directory: ticketdesk/backend/dotnet-comment-service
        run: dotnet test --verbosity normal

  test-python-service:
    name: Python Attachment & Lambda Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ticketdesk/backend/python-attachment-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest for Attachment Service
        working-directory: ticketdesk/backend/python-attachment-service
        run: pytest -v

      - name: Run Pytest for Lambda File Processor
        working-directory: ticketdesk/aws/lambda/file-processor
        run: |
          pip install boto3 pytest
          pytest test_lambda.py -v

  test-frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ticketdesk/frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ticketdesk/frontend
        run: npm ci

      - name: Run TypeScript Compile
        working-directory: ticketdesk/frontend
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: ticketdesk/frontend
        run: npm test

  validate-terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        working-directory: ticketdesk/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init (Mock Backend)
        working-directory: ticketdesk/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ticketdesk/terraform
        run: terraform validate
